:root,[data-theme="rose"]{--bg:#FFF3F5;--surface:#FFFFFF;--ink:#2A1622;--muted:#8A6B78;--acc:#D93F76;--acc-ink:#fff;--acc2:#F2B84B;--soft:#FCE1E8;--line:#F1D3DC;--bad:#C62D2D;--good:#2F8F5B}
[data-theme="sage"]{--bg:#F2F6F1;--surface:#FFFFFF;--ink:#1E2B24;--muted:#627669;--acc:#357E60;--acc-ink:#fff;--acc2:#E3A13E;--soft:#DDEBE2;--line:#D2E0D6}
[data-theme="lilac"]{--bg:#F5F2FB;--surface:#FFFFFF;--ink:#231B36;--muted:#72678A;--acc:#6E4FD0;--acc-ink:#fff;--acc2:#EE7FA0;--soft:#E7E0FA;--line:#DDD5F2}
[data-theme="midnight"]{--bg:#15121F;--surface:#221C31;--ink:#F4EEFA;--muted:#A99EC0;--acc:#F07FA6;--acc-ink:#2A1622;--acc2:#F5CB6B;--soft:#2F2744;--line:#3A3150;--bad:#FF7B7B;--good:#6FD49A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px;border-radius:8px}
.serif{font-family:"Young Serif",Georgia,"Times New Roman",serif;font-weight:400}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(96px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.logo{font-family:"Young Serif",Georgia,serif;font-size:22px;display:flex;align-items:center;gap:6px}
.logo svg{width:22px;height:22px;color:var(--acc)}
.iconbtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.iconbtn svg{width:20px;height:20px}
h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:28px;margin:4px 0 12px;letter-spacing:-.01em}
h3{font-size:15px;font-weight:700;margin:22px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h3 small{font-weight:500;color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* hero arch */
.arch{position:relative;background:var(--acc);color:var(--acc-ink);border-radius:220px 220px 26px 26px;padding:52px 20px 24px;text-align:center;overflow:hidden}
.arch::before{content:"";position:absolute;inset:10px;border:1.5px solid color-mix(in srgb,var(--acc-ink) 45%,transparent);border-radius:210px 210px 18px 18px;pointer-events:none}
.arch .names{font-family:"Young Serif",Georgia,serif;font-size:21px;opacity:.95}
.arch .days{font-family:"Young Serif",Georgia,serif;font-size:clamp(84px,28vw,128px);line-height:1;margin:6px 0 2px;display:inline-block;transition:transform .15s}
.arch .days:active{transform:scale(.94)}
.arch .sub{font-size:15px;opacity:.9}
.arch .date{margin-top:14px;display:inline-block;padding:6px 14px;border-radius:99px;background:color-mix(in srgb,var(--acc-ink) 18%,transparent);font-weight:600;font-size:14px}
.hype{text-align:center;margin:14px 8px 0;font-size:15px;color:var(--muted)}

.ready{margin-top:16px;display:flex;gap:16px;align-items:center}
.ring{width:78px;height:78px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:19px}
.ready .lvl{font-family:"Young Serif",Georgia,serif;font-size:20px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left}
.stat .n{font-family:"Young Serif",Georgia,serif;font-size:24px;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .4s}
.bar.over i{background:var(--bad)}

/* list rows */
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;min-height:56px;width:100%;text-align:left}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .2s;background:var(--surface)}
.check svg{width:16px;height:16px;opacity:0;color:var(--acc-ink)}
.done .check{background:var(--acc);border-color:var(--acc)}
.done .check svg{opacity:1}
.done .ttl{text-decoration:line-through;color:var(--muted)}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);white-space:nowrap}
.tag.late{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.tag.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.side-a{background:var(--soft);color:var(--acc)}
.side-b{background:color-mix(in srgb,var(--acc2) 28%,transparent);color:color-mix(in srgb,var(--acc2) 60%,var(--ink))}
.side-both{background:var(--line);color:var(--ink)}

.rsvp{font-size:13px;font-weight:700;padding:7px 12px;border-radius:99px;min-width:78px;text-align:center}
.rsvp.yes{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.rsvp.no{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.rsvp.maybe{background:color-mix(in srgb,var(--acc2) 30%,transparent)}
.rsvp.wait{background:var(--soft);color:var(--muted)}

.seg{display:flex;background:var(--soft);border-radius:99px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:99px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chip{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;background:var(--acc);color:var(--acc-ink);min-height:48px}
.btn svg{width:20px;height:20px;flex:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
.btn.small{padding:8px 14px;min-height:36px;font-size:14px;border-radius:12px}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow .btn{flex:1}

.grp{margin-top:18px}
.grp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.grp-h b{font-size:15px}
.grp-h span{font-size:13px;color:var(--muted)}

/* timeline */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tl .item{position:relative}
.tl .item::before{content:"";position:absolute;left:-21px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.tl time{font-weight:700;font-variant-numeric:tabular-nums;min-width:60px}

/* seating */
.tray{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.tray .chips{margin:0}
.gchip{padding:8px 12px;border-radius:99px;background:var(--surface);border:1.5px dashed var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.gchip.sel{background:var(--acc);color:var(--acc-ink);border:1.5px solid var(--acc);transform:translateY(-2px)}
.hint{font-size:14px;color:var(--muted);margin:6px 0 0}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.tbl{position:relative;aspect-ratio:1;border-radius:22px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;transition:transform .15s,box-shadow .15s}
.tbl.target{box-shadow:0 0 0 3px var(--acc2);animation:pulse 1.2s infinite}
.tbl.full{opacity:.55}
@keyframes pulse{50%{transform:scale(.97)}}
.tbl .top{width:48%;aspect-ratio:1;border-radius:50%;background:var(--soft);display:grid;place-items:center;text-align:center;padding:4px}
.tbl .top b{display:block;font-size:14px;line-height:1.15}
.tbl .top small{font-size:12px;color:var(--muted)}
.seat{position:absolute;width:24px;height:24px;border-radius:50%;margin:-12px 0 0 -12px;font-size:10px;font-weight:700;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--line);color:var(--muted)}
.seat.taken{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--acc)}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(20,10,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:520px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto}
#sheet.on{transform:none}
#sheet:not(.on){visibility:hidden;transition:transform .25s,opacity .2s,visibility 0s .25s}

.f{display:block;margin-bottom:12px}

.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog{display:flex;align-items:center;gap:10px;padding:12px 0;font-weight:600}

.actions{display:flex;gap:10px;margin-top:8px}

.swatches{display:flex;gap:10px;margin-bottom:12px}

/* onboarding */

.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty .serif{font-size:20px;color:var(--ink);margin-bottom:4px}
.note{background:color-mix(in srgb,var(--acc2) 22%,transparent);border-radius:14px;padding:12px 14px;font-size:14px;margin-top:14px;display:flex;gap:10px;align-items:center}
.meals{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

#toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
#print{display:none}


/* ---------- desktop ---------- */
.homegrid,.colA,.colB{display:block}
.gtbl{display:contents}
@media (hover:hover){
 .item:hover,.stat:hover,.tbl:hover,.chip:hover,.gchip:hover{border-color:var(--acc)}

}

 nav.tabs{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);padding:84px 16px 24px;background:var(--surface)}

 h2{font-size:38px;margin-top:0}
 .homegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start}

 .arch{padding-top:64px}

 .tray{top:0;margin:0;padding:12px 0;border-radius:0}
 .seg{max-width:420px}
 .addrow{max-width:520px}
 .search{max-width:420px}
 #sheet{top:50%;bottom:auto;left:50%;right:auto;width:480px;border-radius:24px;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;transition:all .2s}
 #sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
 #sheet .grab{display:none}
 #toast{bottom:32px;margin-left:116px}

}
.demobar{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 12px 10px 14px;margin-bottom:12px;font-size:14px;font-weight:600}

#print table.pr th,#print table.pr td{border:1px solid #bbb;padding:5px 7px;text-align:left}#print table.pr th{background:#f3f3f3}#print .pc{font-family:Arial,sans-serif;font-size:13px;padding:3px 0}#print .pc span{color:#777}#print h3{font-family:Arial,sans-serif;font-size:14px;margin:14px 0 4px}}
@media (min-width:900px){.saved{position:fixed;left:30px;bottom:84px;margin:0;z-index:22}}

<body>
<div id="app"></div>
<nav class="tabs" id="nav" hidden><div class="in"></div></nav>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-modal="true"></div>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="csvFile" accept=".csv,text/csv,text/plain" hidden>

<script>
/* ---------- build settings ---------- */
const DEMO=false;
const SHOP_URL='https://keptapps.etsy.com';

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='hitched-planner-v1';
const buzz=(ms=12)=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const I={
 heart:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.1 4.3 2.4.8-1.3 2.3-2.4 4.3-2.4 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg>',
 gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
 tick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>',
 plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 10l2 2 4-4M8 16h8"/></svg>',
 money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>',
 guests:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M17 14.5c2.4 0 4 1.4 4.5 4"/></svg>',
 seats:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="3.5" r="1.6"/><circle cx="12" cy="20.5" r="1.6"/><circle cx="3.5" cy="12" r="1.6"/><circle cx="20.5" cy="12" r="1.6"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 wand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20 15 9M14 4v2M19 9h2M18 5l1.5-1.5M12 7l5 5"/></svg>'
};

/* ---------- data ---------- */
const GROUPS=[
 {k:'12m',label:'12+ months out',due:300},{k:'9m',label:'9 to 12 months',due:270},{k:'6m',label:'6 to 9 months',due:180},
 {k:'3m',label:'3 to 6 months',due:90},{k:'1m',label:'1 to 3 months',due:30},{k:'wk',label:'Final weeks',due:3},{k:'day',label:'The big day',due:0}];
const DEFAULT_TASKS={
 '12m':['Set your total budget','Draft the guest list','Pick the date','Book the venue','Ask your wedding party'],
 '9m':['Book the photographer','Book the caterer','Book music or a DJ','Start outfit shopping','Book a planner or coordinator'],
 '6m':['Send save-the-dates','Book the florist','Book hair and makeup','Plan the honeymoon','Set up a gift registry'],
 '3m':['Order invitations','Buy the rings','Book transport','Menu tasting','Mail the invitations'],
 '1m':['Chase missing RSVPs','Final outfit fitting','Finish the seating chart','Write your vows','Confirm times with every vendor'],
 'wk':['Give final headcount to caterer','Pay final vendor balances','Pack for the honeymoon','Prepare tip envelopes','Rehearsal'],
 'day':['Eat a proper breakfast','Hand the rings to someone you trust','Breathe and enjoy every minute']};
const CATS=[['Venue',30],['Catering',25],['Photo & video',10],['Outfits',8],['Flowers & decor',8],['Music',5],['Rings',5],['Hair & makeup',3],['Stationery',2],['Favours & gifts',2],['Transport',2]];
const MEALS=['Not chosen','Chicken','Beef','Fish','Vegetarian','Vegan','Kids meal'];
const VTYPES=['Venue','Caterer','Photographer','Videographer','Florist','Music / DJ','Hair & makeup','Cake','Planner','Transport','Other'];
const VEMOJI={'Venue':'🏛️','Caterer':'🍽️','Photographer':'📸','Videographer':'🎥','Florist':'💐','Music / DJ':'🎶','Hair & makeup':'💄','Cake':'🎂','Planner':'📋','Transport':'🚗','Other':'✨'};
const TYPE2CAT={'Venue':'Venue','Caterer':'Catering','Cake':'Catering','Photographer':'Photo & video','Videographer':'Photo & video','Florist':'Flowers & decor','Music / DJ':'Music','Hair & makeup':'Hair & makeup','Transport':'Transport'};
const THEMES=[['rose','Rose','#D93F76'],['sage','Sage','#357E60'],['lilac','Lilac','#6E4FD0'],['midnight','Midnight','#F07FA6']];
const SHAPES=[['round','Round'],['long','Long table'],['sweet','Sweetheart']];
const RS={wait:'Waiting',yes:'Coming',maybe:'Maybe',no:"Can't"};

function fresh(){
 const tasks=[];GROUPS.forEach(g=>DEFAULT_TASKS[g.k].forEach(t=>tasks.push({id:uid(),t,g:g.k,done:false,by:''})));
 return {v:2,setup:false,a:'',b:'',date:'',rsvpBy:'',cur:'$',total:20000,theme:'rose',tasks,
  cats:CATS.map(([n,p])=>({id:uid(),name:n,est:Math.round(20000*p/100),act:0})),
  guests:[],tables:[1,2,3,4].map(n=>({id:uid(),name:'Table '+n,seats:8,shape:'round'})),
  vendors:[],timeline:[['08:00','Hair and makeup'],['12:00','Photos'],['14:00','Ceremony'],['15:00','Drinks and canapés'],['17:00','Dinner and speeches'],['19:30','First dance'],['22:30','Send-off']].map(([time,what])=>({id:uid(),time,what})),
  lastBackup:0};
}
const guessCat=(type,cats)=>{const c=cats.find(c=>c.name===TYPE2CAT[type]);return c?c.id:''};
function migrate(d){
 const f=fresh();d=Object.assign(f,d);
 ['tasks','cats','guests','tables','vendors','timeline'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=f[k]});
 const str=v=>typeof v==='string'?v:v==null?'':String(v);
 d.tasks=d.tasks.filter(t=>t&&typeof t==='object').map(t=>({id:t.id||uid(),t:str(t.t),g:GROUPS.some(g=>g.k===t.g)?t.g:'1m',done:!!t.done,by:str(t.by)}));
 d.cats=d.cats.filter(c=>c&&typeof c==='object').map(c=>({id:c.id||uid(),name:str(c.name),est:+c.est||0,act:+c.act||0}));
 d.tables=d.tables.filter(t=>t&&typeof t==='object').map(t=>({id:t.id||uid(),name:str(t.name)||'Table',seats:Math.max(1,+t.seats||8),shape:SHAPES.some(s=>s[0]===t.shape)?t.shape:'round'}));
 d.guests=d.guests.filter(g=>g&&typeof g==='object'&&g.name).map(g=>({id:g.id||uid(),name:str(g.name),side:['a','b','both'].includes(g.side)?g.side:'both',rsvp:RS[g.rsvp]?g.rsvp:'wait',
  meal:MEALS.includes(g.meal)?g.meal:MEALS[0],age:g.age==='child'?'child':'adult',diet:str(g.diet),plus:!!g.plus,plusName:str(g.plusName),plusMeal:MEALS.includes(g.plusMeal)?g.plusMeal:MEALS[0],
  group:str(g.group),apart:str(g.apart),table:d.tables.some(t=>t.id===g.table)?g.table:null,contact:str(g.contact)}));
 d.vendors=d.vendors.filter(v=>v&&typeof v==='object').map(v=>({id:v.id||uid(),name:str(v.name),type:VTYPES.includes(v.type)?v.type:'Other',cost:+v.cost||0,dep:+v.dep||0,due:str(v.due),paid:!!v.paid,contact:str(v.contact),notes:str(v.notes),
  cat:d.cats.some(c=>c.id===v.cat)?v.cat:guessCat(v.type,d.cats)}));
 d.timeline=d.timeline.filter(e=>e&&typeof e==='object').map(e=>({id:e.id||uid(),time:str(e.time),what:str(e.what)}));
 d.total=+d.total||0;d.cur=str(d.cur)||'$';if(!THEMES.some(t=>t[0]===d.theme))d.theme='rose';d.v=2;
 return d;
}
function load(){if(DEMO)return fresh();try{const r=localStorage.getItem(KEY);if(r)return migrate(JSON.parse(r))}catch(e){}return fresh()}
let S=load(),saveOK=true;
function save(){
 if(DEMO)return;
 try{localStorage.setItem(KEY,JSON.stringify(S));saveOK=true}catch(e){saveOK=false}
 const el=$('#saved');if(!el)return;
 el.className='saved '+(saveOK?'flash':'err');el.textContent=saveOK?'All changes saved':'Not saved. Download a backup now.';
 clearTimeout(save.t);if(saveOK)save.t=setTimeout(()=>el.classList.remove('flash'),1200);
}
const UI={tab:'home',planSeg:'list',moneySeg:'budget',gf:'all',q:'',sel:null};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

/* ---------- derived ---------- */
const parseD=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today0=()=>{const t=new Date();t.setHours(0,0,0,0);return t};
const wDate=()=>parseD(S.date);
const daysUntil=s=>{const d=parseD(s);return d?Math.round((d-today0())/864e5):null};
const daysTo=()=>daysUntil(S.date);
const money=n=>(n<0?'-':'')+S.cur+Math.abs(Math.round(+n||0)).toLocaleString();
const initials=n=>(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
const fmtDate=s=>parseD(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const heads=g=>1+(g.plus?1:0);
const plusLabel=g=>g.plus?(g.plusName||'Guest of '+g.name.split(' ')[0]):'';
const coming=g=>g.rsvp!=='no';
const vPaid=v=>v.paid?(+v.cost||0):Math.min(+v.dep||0,+v.cost||Infinity);
function catSpent(c){return (+c.act||0)+S.vendors.filter(v=>v.cat===c.id).reduce((s,v)=>s+vPaid(v),0)}
function catBooked(c){return (+c.act||0)+S.vendors.filter(v=>v.cat===c.id).reduce((s,v)=>s+(+v.cost||0),0)}
function totalSpent(){return S.cats.reduce((s,c)=>s+catSpent(c),0)+S.vendors.filter(v=>!S.cats.some(c=>c.id===v.cat)).reduce((s,v)=>s+vPaid(v),0)}
function taskDue(t){if(t.by)return t.by;const w=wDate();if(!w)return '';const g=GROUPS.find(x=>x.k===t.g);const d=new Date(w);d.setDate(d.getDate()-g.due);return iso(d)}
function isLate(t){if(t.done)return false;const d=taskDue(t);return !!d&&daysUntil(d)<0}
function mealCounts(list){const m={};list.forEach(g=>{[[g.meal],g.plus?[g.plusMeal]:[]].flat().forEach(x=>{if(x&&x!==MEALS[0])m[x]=(m[x]||0)+1})});return m}
function stats(){
 const T=S.tasks.length,TD=S.tasks.filter(t=>t.done).length,G=S.guests;
 const yes=G.filter(g=>g.rsvp==='yes'),answered=G.filter(g=>g.rsvp==='yes'||g.rsvp==='no').length;
 const comingG=G.filter(coming),seated=comingG.filter(g=>g.table);
 const sum=a=>a.reduce((s,g)=>s+heads(g),0);
 const parts=[T?TD/T:0,G.length?answered/G.length:0,comingG.length?seated.length/comingG.length:0];
 return{T,TD,invites:G.length,invited:sum(G),yes:sum(yes),kids:yes.filter(g=>g.age==='child').length,waiting:G.filter(g=>g.rsvp==='wait').length,
  comingHeads:sum(comingG),seatedHeads:sum(seated),spent:totalSpent(),ready:Math.round(parts.reduce((a,b)=>a+b,0)/3*100)};
}
function level(p){return p>=100?'Ready to say I do':p>=80?'Almost there':p>=55?'Planning pro':p>=25?'On a roll':'Just getting started'}
function seatsUsed(tid){return S.guests.filter(g=>g.table===tid&&coming(g)).reduce((s,g)=>s+heads(g),0)}
function seatingWarnings(){
 const w=[],tn=id=>(S.tables.find(t=>t.id===id)||{}).name;
 const groups={};S.guests.filter(g=>coming(g)&&g.group&&g.table).forEach(g=>{(groups[g.group]=groups[g.group]||new Set()).add(g.table)});
 Object.entries(groups).forEach(([k,set])=>{if(set.size>1)w.push(`${esc(k)} is split across ${[...set].map(tn).map(esc).join(' and ')}`)});
 const seen=new Set();S.guests.forEach(g=>{if(!g.apart||!g.table||!coming(g))return;const o=S.guests.find(x=>x.id===g.apart);
  if(o&&o.table===g.table&&coming(o)){const k=[g.id,o.id].sort().join();if(!seen.has(k)){seen.add(k);w.push(`${esc(g.name)} and ${esc(o.name)} should be kept apart but are both at ${esc(tn(g.table))}`)}}});
 S.tables.forEach(t=>{const u=seatsUsed(t.id);if(u>t.seats)w.push(`${esc(t.name)} has ${u} people for ${t.seats} seats`)});
 return w;

function hypeLine(d){

 if(d<0)return 'Congratulations, you did it! 🥂';
 if(d===0)return 'Today is the day. Go get married! 💍';
 if(d===1)return 'One more sleep. Put your phone down and rest.';

function seatDots(t,labels){
 const n=t.seats,pos=[];
 if(t.shape==='round')for(let i=0;i<n;i++){const a=i/n*2*Math.PI-Math.PI/2;pos.push([50+39*Math.cos(a),50+39*Math.sin(a)])}
 else if(t.shape==='sweet'){for(let i=0;i<n;i++)pos.push([n===1?50:30+40*i/(n-1),68])}
 else{const top=Math.ceil(n/2),bot=n-top;const row=(k,y)=>{for(let i=0;i<k;i++)pos.push([k===1?50:18+64*i/(k-1),y])};row(top,24);row(bot,76)}
 return pos.map(([x,y],i)=>`<span class="seat ${labels[i]?'taken':''}" style="left:${x}%;top:${y}%">${labels[i]?esc(labels[i]):''}</span>`).join('');
}

 ${warn.length?`<div class="warn">${warn.map(x=>`<div>⚠️ ${x}</div>`).join('')}</div>`:''}
 <div class="tables">${S.tables.map(t=>{const used=seatsUsed(t.id),full=used>=t.seats;
  const labels=[];S.guests.filter(g=>g.table===t.id&&coming(g)).forEach(g=>{labels.push(initials(g.name));if(g.plus)labels.push(g.plusName?initials(g.plusName):'+1')});

 <div class="addrow"><button class="btn" data-act="addTable">${I.plus}Add a table</button>${un.length?`<button class="btn ghost" data-act="autoSeat">${I.wand}Suggest seats</button>`:''}<button class="btn ghost" data-act="print" data-id="seats">Print</button></div>`;
}

 if(kind==='guests')return [['Name','Side','RSVP','Meal','Age','Dietary needs','Plus-one','Plus-one name','Plus-one meal','Group','Table','Contact'],
  ...S.guests.map(g=>[g.name,sideName(g.side),RS[g.rsvp],g.meal,g.age,g.diet,g.plus?'Yes':'No',g.plusName,g.plus?g.plusMeal:'',g.group,tn(g.table),g.contact])];
 if(kind==='budget')return [['Category','Planned','Spent','Booked'],...S.cats.map(c=>[c.name,c.est,catSpent(c),catBooked(c)]),['Total budget',S.total,totalSpent(),S.cats.reduce((s,c)=>s+catBooked(c),0)]];
 return [['Vendor','Type','Budget category','Total cost','Deposit','Paid in full','Balance','Balance due','Contact','Notes'],
  ...S.vendors.map(v=>[v.name,v.type,cn(v.cat),v.cost,v.dep,v.paid?'Yes':'No',v.paid?0:Math.max(0,v.cost-v.dep),v.due,v.contact,v.notes])];
}
function parseCSV(txt){const rows=[];let row=[],f='',q=false;txt=txt.replace(/^\ufeff/,'');
 for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','||c===';'&&!txt.includes(',')){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
 if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
function importGuests(txt){

 if(ix.pn===ix.plus)ix.plus=-1;
 const get=(r,i)=>i>=0?(r[i]||'').trim():'';const low=s=>s.toLowerCase();
 const have=new Set(S.guests.map(g=>low(g.name)));let added=0,skipped=0;
 (hasHeader?rows.slice(1):rows).forEach(r=>{const name=get(r,ni).replace(/\+\s*1\s*$/,'').trim();if(!name)return;if(have.has(low(name))){skipped++;return}have.add(low(name));
  const rs=low(get(r,ix.rsvp)),sd=low(get(r,ix.side)),pv=low(get(r,ix.plus)),pn=get(r,ix.pn),mm=s=>MEALS.find(m=>low(m)===low(s))||MEALS[0],tb=low(get(r,ix.table));
  S.guests.push(newGuest({name,

   side:S.a&&sd.includes(low(S.a))?'a':S.b&&sd.includes(low(S.b))?'b':'both',

   plus:!!pn||/^(yes|y|true|1)$/.test(pv)||/\+\s*1\s*$/.test(get(r,ni)),plusName:pn,plusMeal:mm(get(r,ix.pm)),group:get(r,ix.group),contact:get(r,ix.contact),
   table:(S.tables.find(t=>low(t.name)===tb)||{}).id||null}));added++});
 save();closeSheet();UI.tab='guests';render();toast(`Added ${added} guest${added===1?'':'s'}${skipped?`, skipped ${skipped} already on your list`:''}`);if(added)confetti(60);
}
function icsFile(){

 const icsEsc=s=>String(s).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
 const now=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
 const ev=(date,title,desc)=>{if(!date)return;const d=date.replace(/-/g,'');const e=parseD(date);e.setDate(e.getDate()+1);
  L.push('BEGIN:VEVENT','UID:'+uid()+'@hitched','DTSTAMP:'+now,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+iso(e).replace(/-/g,''),'SUMMARY:'+icsEsc(title),desc?'DESCRIPTION:'+icsEsc(desc):'','BEGIN:VALARM','TRIGGER:-P3D','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(title),'END:VALARM','END:VEVENT')};
 ev(S.date,`${S.a} & ${S.b}'s wedding 💍`,'');ev(S.rsvpBy,'RSVP deadline','Chase anyone who has not replied yet.');
 S.vendors.filter(v=>!v.paid&&v.due).forEach(v=>ev(v.due,`Pay ${v.name}`,`Balance due: ${money(Math.max(0,v.cost-v.dep))}`));
 L.push('END:VCALENDAR');return L.filter(Boolean).join('\r\n');

/* ---------- auto seating ---------- */
function autoSeat(){
 const un=S.guests.filter(g=>coming(g)&&!g.table);
 const units=[],used=new Set();
 un.forEach(g=>{if(used.has(g.id))return;const m=g.group?un.filter(x=>x.group===g.group):[g];m.forEach(x=>used.add(x.id));units.push(m)});
 units.sort((a,b)=>b.reduce((s,g)=>s+heads(g),0)-a.reduce((s,g)=>s+heads(g),0));
 const free=t=>t.seats-seatsUsed(t.id);
 const score=(t,m)=>{const at=S.guests.filter(x=>x.table===t.id&&coming(x));let s=0;
  m.forEach(g=>{if(g.group&&at.some(x=>x.group===g.group))s+=20;s+=at.filter(x=>x.side===g.side).length*2;if(at.some(x=>x.apart===g.id||g.apart===x.id))s-=100;if(g.age==='child')s+=at.filter(x=>x.age==='child').length*3});
  return s-free(t)*.1};
 const place=m=>{const need=m.reduce((s,g)=>s+heads(g),0);const cands=S.tables.filter(t=>t.shape!=='sweet'&&free(t)>=need);if(!cands.length)return false;
  cands.sort((a,b)=>score(b,m)-score(a,m));m.forEach(g=>g.table=cands[0].id);return true};
 let seated=0,left=0;
 units.forEach(m=>{if(place(m))seated+=m.length;else m.forEach(g=>place([g])?seated++:left++)});
 save();render();
 if(seated)confetti(100);
 toast(seated?`Seated ${seated} guest${seated===1?'':'s'}${left?`. ${left} didn't fit, so add a table`:''}. Drag or tap to adjust.`:'No free seats. Add a table first.');
}

 csv:id=>{dl(`hitched-${id}-${stamp()}.csv`,'\ufeff'+toCSV(id).map(csvRow).join('\r\n'),'text/csv;charset=utf-8');toast('Spreadsheet downloaded')},
 ics:()=>{if(!S.date&&!S.vendors.some(v=>v.due))return toast('Add your wedding date in Settings first');dl('hitched-wedding-dates.ics',icsFile(),'text/calendar');toast('Calendar file downloaded. Open it to add the dates.')},
 theme:id=>{S.theme=id;save();document.documentElement.dataset.theme=id;document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.id===id))},
 export:()=>{S.lastBackup=Date.now();save();dl('hitched-backup-'+stamp()+'.json',JSON.stringify(Object.assign({app:'hitched'},S)),'application/json');toast('Backup downloaded');if(!$('#sheet').classList.contains('on'))render()},
 import:()=>$('#importFile').click(),
 reset:()=>{if(confirm('Erase everything and start a blank planner? Download a backup first if you might want it.')){undoSnap=JSON.stringify(S);S=fresh();save();closeSheet();UI.tab='home';render();toast('Planner cleared',true)}},
 sheetSave:()=>{if(sheetSave&&sheetSave()===true){save();closeSheet();render()}},
 sheetDel:()=>{if(!sheetDel)return;undoSnap=JSON.stringify(S);sheetDel();save();closeSheet();render();toast('Deleted',true)},
 undo:()=>{if(!undoSnap)return;S=migrate(JSON.parse(undoSnap));undoSnap=null;save();render();toast('Restored')},
 close:()=>closeSheet()
};
const LOCKED=['export','import','csv','csvImport','ics','print','reset'];
function upsell(){openSheet('Included in the full planner',`<p style="margin:-4px 0 12px">Printing, PDF and spreadsheet exports, CSV guest import, calendar dates and backups all come with the full Hitched planner.</p>
 <div class="list" style="margin-bottom:14px">${['Your plans saved automatically on your phone or computer','Print seating charts, guest lists and schedules, or save them as PDF','Import your guest list from Excel or Google Sheets','Add payment dates and your RSVP deadline to your calendar','One-time purchase. No subscription, no account'].map(t=>`<div class="item"><span class="check" style="background:var(--acc);border-color:var(--acc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="opacity:1;color:var(--acc-ink)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="grow">${t}</span></div>`).join('')}</div>
 <a class="btn wide" href="${SHOP_URL}" target="_blank" rel="noopener">Get the full planner on Etsy</a>`,null,null)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(DEMO&&LOCKED.includes(el.dataset.act)){e.preventDefault();return upsell()}const f=ACT[el.dataset.act];if(f){e.preventDefault();f(el.dataset.id,el)}});
document.addEventListener('change',e=>{if(e.target.id==='f_p')$('#plusf').hidden=!e.target.checked;if(e.target.id==='f_ty'&&!$('#f_cat').dataset.touched){const c=guessCat(e.target.value,S.cats);$('#f_cat').value=c}if(e.target.id==='f_cat')e.target.dataset.touched=1});
$('#scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'&&$('#sheet').classList.contains('on')&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox')ACT.sheetSave()});
document.addEventListener('input',e=>{if(e.target.id==='gq'){UI.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#gq');q.focus();q.setSelectionRange(pos,pos)}});
$('#importFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
 try{const d=JSON.parse(r.result);if(!d||typeof d!=='object'||!Array.isArray(d.tasks)||!Array.isArray(d.guests)||!Array.isArray(d.cats))throw 0;
  undoSnap=JSON.stringify(S);S=migrate(d);S.setup=true;save();closeSheet();render();toast('Backup restored',true)}
 catch(err){toast("That file isn't a Hitched backup. Choose the .json file you downloaded.")}};r.readAsText(f);e.target.value=''});
$('#csvFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{importGuests(r.result)}catch(err){toast("Couldn't read that file. Save it as CSV and try again.")}};r.readAsText(f);e.target.value=''});

/* desktop drag and drop for seating */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.gchip');if(!c)return;UI.sel=c.dataset.id;e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move'});
document.addEventListener('dragover',e=>{const t=e.target.closest&&e.target.closest('.tbl');if(!t)return;e.preventDefault();document.querySelectorAll('.tbl.dragover').forEach(x=>x!==t&&x.classList.remove('dragover'));t.classList.add('dragover')});
document.addEventListener('dragleave',e=>{const t=e.target.closest&&e.target.closest('.tbl');if(t&&!t.contains(e.relatedTarget))t.classList.remove('dragover')});
document.addEventListener('drop',e=>{const t=e.target.closest&&e.target.closest('.tbl');if(!t)return;e.preventDefault();UI.sel=e.dataTransfer.getData('text/plain')||UI.sel;ACT.table(t.dataset.id)});
document.addEventListener('dragend',()=>{document.querySelectorAll('.tbl.dragover').forEach(x=>x.classList.remove('dragover'));if(UI.sel&&UI.tab==='seats'){UI.sel=null;render()}});

/* ---------- toast + confetti ---------- */
let tt;function toast(m,undo){const t=$('#toast');t.innerHTML=esc(m)+(undo?' <button data-act="undo">Undo</button>':'');t.classList.toggle('act',!!undo);t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>{t.classList.remove('on','act')},undo?6000:2600)}
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=null;
function confetti(n=60){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
 const cs=getComputedStyle(document.documentElement),cols=[cs.getPropertyValue('--acc'),cs.getPropertyValue('--acc2'),'#ffffff',cs.getPropertyValue('--soft')];
 for(let i=0;i<n;i++)parts.push({x:innerWidth*(.2+Math.random()*.6),y:innerHeight*.35,vx:(Math.random()-.5)*12,vy:-Math.random()*13-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,
  s:5+Math.random()*6,c:cols[i%cols.length],heart:Math.random()<.18,life:0});
 if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
 const d=devicePixelRatio;cx.setTransform(d,0,0,d,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
 parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
  if(p.heart){cx.font=p.s*2.4+'px serif';cx.fillText('♥',0,0)}else cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
 parts=parts.filter(p=>p.y<innerHeight+40&&p.life<260);
 raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,innerWidth,innerHeight),null);
}

  .map(v=>({id:uid(),paid:false,contact:'',notes:'',cat:guessCat(v.type,d.cats),...v}));
 d.lastBackup=Date.now();return d;
}

if(DEMO){S=demoData();UI.demoStart=true}
render();
if(DEMO)setTimeout(()=>{confetti(90);toast('Welcome! This sample wedding is yours to play with.')},400);
